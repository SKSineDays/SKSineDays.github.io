name: Privacy consent review
on:
  pull_request:
    paths:
      - 'js/privacy-consent.js'
      - 'js/vercel-analytics.js'
      - 'js/day-photo*.js'
      - 'js/affiliate-ui.js'
      - 'js/ui.js'
      - 'privacy.html'
      - 'test/privacy*'
      - '.github/workflows/privacy-consent.yml'
permissions:
  contents: read
jobs:
  privacy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install chromium
      - run: node test/privacy-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-consent-review
          path: artifacts/privacy/
          retention-days: 7
          if-no-files-found: warn
