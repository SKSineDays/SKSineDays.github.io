<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05060A">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Confirm Daily SineDay Emails — SineDay</title>

  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
  <link rel="icon" type="image/svg+xml" href="/breathingicon.svg?v=2">
  <link rel="stylesheet" href="/css/daily.css">
</head>
<body class="daily-page daily-confirm-page">
  <a class="daily-skip-link" href="#daily-confirm-main">Skip to confirmation</a>

  <header class="daily-header">
    <a class="daily-brand" href="/" aria-label="SineDay home">
      <img src="/assets/brand/sineday-wordmark.svg" alt="SineDay" width="700" height="190">
    </a>
  </header>

  <main id="daily-confirm-main" class="daily-confirm-main">
    <section class="daily-confirm-card" aria-labelledby="daily-confirm-title">
      <div class="daily-confirm-card__duck" aria-hidden="true">
        <img src="/assets/sineducks/SineDuck%20Celebrity.svg" alt="" width="576" height="324">
      </div>
      <p class="daily-eyebrow">One quiet step</p>
      <h1 id="daily-confirm-title">Confirm your daily emails.</h1>
      <p id="daily-confirm-copy" class="daily-confirm-copy">Your SineDay rhythm will stay paused until you confirm that this email address belongs to you.</p>

      <div class="daily-confirm-actions">
        <button id="daily-confirm-button" class="daily-submit" type="button">
          Confirm my daily emails
        </button>
        <p id="daily-confirm-status" class="daily-form-status" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>

      <div id="daily-confirm-schedule" class="daily-confirm-schedule" hidden>
        <p class="daily-confirm-schedule__label">Your saved morning schedule</p>
        <p id="daily-confirm-schedule-value"></p>
      </div>

      <p class="daily-confirm-fresh">
        Need a new link? <a href="/daily">Start a fresh signup</a>.
      </p>
    </section>
  </main>

  <footer class="daily-footer">
    <p>© SineDay™ 2026</p>
    <nav aria-label="Confirmation footer">
      <a href="/privacy.html" rel="noreferrer">Privacy</a>
      <a href="/contact.html" rel="noreferrer">Contact</a>
    </nav>
  </footer>

  <script type="module" src="/js/daily-confirm.js"></script>
</body>
</html>
